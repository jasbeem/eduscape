    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23050505'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='12' fill='%2300ff41'>&gt;_</text></svg>">
    
    <script>
      // Defensive shim for process.env - Must be before other scripts
      window.process = window.process || { env: {} };

    <!-- Tailwind CSS (Local) -->

    <style>
      body {
        font-family: 'Share Tech Mono', monospace;
        background-color: #050505;
        color: #00ff41;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #00ff41;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff;
      }
      
      /* CRT/Glitch Effects */
      .scanline {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 50;
      }
      
      /* New CSS Grid Pattern - No external images required */
      .bg-grid-pattern {
        background-size: 50px 50px;
        background-image: 
          linear-gradient(to right, rgba(0, 255, 65, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
        mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 30%, transparent 100%);
      }

      .glow-text {
        text-shadow: 0 0 5px #00ff41, 0 0 10px #00ff41;
      }
      .glow-text-blue {
        text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff;
      }
      .glow-border {
        box-shadow: 0 0 5px #00ff41, inset 0 0 5px #00ff41;
      }
      .glow-border-red {
        box-shadow: 0 0 10px #ff0000, inset 0 0 10px #ff0000;
      }
      .glow-border-yellow {
        box-shadow: 0 0 5px #eab308, inset 0 0 5px #eab308;
      }

      /* Audio Equalizer Animation */
      @keyframes equalize {
        0% { height: 20%; }
        50% { height: 100%; }
        100% { height: 20%; }
      }
      .eq-bar {
        width: 4px;
        background-color: #00ff41;
        margin-right: 1px;
        animation: equalize 1s infinite ease-in-out;
      }
      .eq-bar:nth-child(1) { animation-duration: 0.8s; }
      .eq-bar:nth-child(2) { animation-duration: 1.1s; }
      .eq-bar:nth-child(3) { animation-duration: 0.9s; }
      .eq-bar:nth-child(4) { animation-duration: 1.2s; }
      .eq-paused .eq-bar { animation-play-state: paused; height: 10%; background-color: #004411; }

      @keyframes glitch-anim {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }
      .glitch-hover:hover {
        animation: glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
      }
      
      /* Utilities */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #00ff41; }
      .animate-fade-in { animation: fadeIn 0.5s ease-in; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      /* Toggle Switch */
      .toggle-checkbox:checked {
        right: 0;
        border-color: #00ff41;
      }
      .toggle-checkbox:checked + .toggle-label {
        background-color: #00ff41;
      }
    </style>

<body>

    <!-- THE MONOLITHIC APPLICATION SCRIPT -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        // ==========================================
        // CONSTANTS & CONFIG
        // ==========================================
        
        // Get App ID from URL (e.g., ?id=clase_matematicas) or default
        const getAppId = () => {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || 'default';
        };

        const APP_ID = getAppId();

        const ADMIN_CONFIG = {
          USERNAME: 'Bedoya'
          // Password is now handled server-side
        };

        // ⚠️ IMPORTANTE: PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT (WEB APP)
        const API_URL = "https://script.google.com/macros/s/AKfycbyswGNIGw2ut_ONXNohwSeU4LrfINZz1WIiALBrkS2IWa1kS5WNxQUHY-YMwkxacwYB/exec"; 

        const AVATAR_LIST = [
          { name: "TIGRE", emoji: "🐯" }, { name: "LOBO", emoji: "🐺" }, { name: "OSO", emoji: "🐻" },
          { name: "ÁGUILA", emoji: "🦅" }, { name: "TIBURÓN", emoji: "🦈" }, { name: "ZORRO", emoji: "🦊" },
          { name: "LEÓN", emoji: "🦁" }, { name: "BÚHO", emoji: "🦉" }, { name: "GORILA", emoji: "🦍" },
          { name: "DRAGÓN", emoji: "🐲" }, { name: "PANDA", emoji: "🐼" }, { name: "KOALA", emoji: "🐨" },
          { name: "PUMA", emoji: "🐆" }, { name: "JABALÍ", emoji: "🐗" }, { name: "TORO", emoji: "🐂" },
          { name: "SERPIENTE", emoji: "🐍" }, { name: "COCODRILO", emoji: "🐊" }, { name: "PULPO", emoji: "🐙" },
          { name: "ESCORPIÓN", emoji: "🦂" }, { name: "ARAÑA", emoji: "🕷️" }, { name: "MURCIÉLAGO", emoji: "🦇" },
          { name: "RHINO", emoji: "🦏" }, { name: "ELEFANTE", emoji: "🐘" }, { name: "CABALLO", emoji: "🐎" }
        ];

        const LOCKOUT_DURATION_MS = 10000;

        // Music Playlist
        const PLAYLIST = [
            { title: "Background", src: "audio/background.mp3" },
            { title: "Cyber Theme", src: "audio/cyber.mp3" },
            { title: "Neural Net", src: "audio/music.mp3" },
            { title: "Track 01", src: "audio/track1.mp3" },
            { title: "Track 02", src: "audio/track2.mp3" },
            { title: "Track 03", src: "audio/track3.mp3" },
            { title: "Track 04", src: "audio/track4.mp3" },
            { title: "Track 05", src: "audio/track5.mp3" }
        ];

        const VICTORY_SOUNDS = [
            "audio/ganador01.mp3",
            "audio/ganador02.mp3"
        ];

        // ==========================================
        // SERVICES/CSVSERVICE.TS
        // ==========================================
        
        // Generate stable ID for questions based on content
        const generateStableId = (str) => {
          let hash = 0;
          if (str.length === 0) return hash;
          for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; // Convert to 32bit integer
          }
          return Math.abs(hash).toString(16);
        };

        const parseCSV = (csvText) => {
          if (!csvText || typeof csvText !== 'string') return [];
          const rawLines = csvText.trim().split(/\r?\n/);
          const lines = rawLines
            .map(l => l.trim())
            .filter(l => l.length > 0 && !l.startsWith('#'));

          if (lines.length < 2) return [];

          const headers = lines[0].split(';').map(h => h.trim().replace(/^[\uFEFF\u200B]/, ''));
          
          // Updated detection logic for new format (Categoría, SdA)
          const categoryKey = headers.find(h => h.toLowerCase() === 'categoria' || h.toLowerCase() === 'categoría');
          const situationKey = headers.find(h => h.toLowerCase() === 'sda' || h.toLowerCase().startsWith('situaci') || h.toLowerCase().startsWith('situación'));

          if (!categoryKey || !situationKey) {
              console.warn("No se encontraron las columnas 'Categoría' o 'SdA' en el CSV. Se intentará continuar.");
          }

          const result = [];
          
          for (let i = 1; i < lines.length; i++) {
            // Updated filtering logic for new format
            if (lines[i].trim() === '' || lines[i].startsWith('#') || lines[i].includes('Categoría;SdA')) continue;

            const currentline = lines[i].split(';');
            const obj = {};
            for (let j = 0; j < headers.length; j++) {
                obj[headers[j]] = currentline[j]?.trim() || "";
            }
            
            obj['_INTERNAL_CATEGORY'] = categoryKey ? obj[categoryKey] : "";
            obj['_INTERNAL_SITUATION'] = situationKey ? obj[situationKey] : "";

            // Validation: Must have a Question and a valid Category/Situation
            if (obj['Pregunta'] && obj['Pregunta'].length > 0 && obj['_INTERNAL_CATEGORY'] && obj['_INTERNAL_SITUATION']) {
                 obj['_ID'] = generateStableId(obj['Pregunta'] + obj['_INTERNAL_CATEGORY']);
                 result.push(obj);
            }
          }
          return result;
        };

        let parsedDataCache = []; 

        const loadAndValidateCSV = async () => {
             try {
                 const response = await fetch('./datos.csv');
                 if (!response.ok) throw new Error(`ERROR FATAL: No se encuentra datos.csv`);
                 const csvText = await response.text();
                 const data = parseCSV(csvText);
                 if (!data || data.length === 0) throw new Error("ERROR FATAL: CSV vacío o formato incorrecto.");
                 parsedDataCache = data;
                 return data;
             } catch (err) {
                 throw err;
             }
        };

        // Get categories that are NOT in the disabled list
        const getUniqueCategories = (disabledCats = []) => {
          const categories = new Set();
          parsedDataCache.forEach(row => {
            if (row['_INTERNAL_CATEGORY'] && !disabledCats.includes(row['_INTERNAL_CATEGORY'])) {
              categories.add(row['_INTERNAL_CATEGORY']);
            }
          });
          return Array.from(categories);
        };

        // Get situations that are NOT in the disabled list
        const getSituationsByCategory = (category, disabledSits = []) => {
          const situations = new Set();
          parsedDataCache.forEach(row => {
            if (row['_INTERNAL_CATEGORY'] === category && 
                row['_INTERNAL_SITUATION'] && 
                !disabledSits.includes(row['_INTERNAL_SITUATION'])) {
              situations.add(row['_INTERNAL_SITUATION']);
            }
          });
          return Array.from(situations);
        };

        // Get questions that are NOT in the disabled ID list
        const getQuestionsBySelection = (category, situation, disabledQuestionIds = []) => {
          const filteredRows = parsedDataCache.filter(row => 
            row['_INTERNAL_CATEGORY'] === category && 
            row['_INTERNAL_SITUATION'] === situation &&
            !disabledQuestionIds.includes(row['_ID'])
          );

          if (filteredRows.length === 0) return [];
          
          let pool = [...filteredRows];
          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
          }

          let finalRows = [];
          if (pool.length >= 20) {
            finalRows = pool.slice(0, 20);
          } else {
            while (finalRows.length < 20) {
              finalRows = finalRows.concat(pool);
            }
            finalRows = finalRows.slice(0, 20);
            for (let i = finalRows.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [finalRows[i], finalRows[j]] = [finalRows[j], finalRows[i]];
            }
          }

          return finalRows.map((row, idx) => {
            const options = [row['R1'], row['R2'], row['R3'], row['R4']];
            const correctIndex = parseInt(row['Correcta']) - 1; 
            return {
              id: row['_ID'],
              text: row['Pregunta'],
              options: options,
              correctAnswer: options[correctIndex] || options[0],
            };
          });
        };

        // Helper for Admin Panel to see everything
        const getFullDataStructure = () => {
          const structure = {};
          parsedDataCache.forEach(row => {
            const cat = row['_INTERNAL_CATEGORY'];
            const sit = row['_INTERNAL_SITUATION'];
            if (!cat || !sit) return;

            if (!structure[cat]) structure[cat] = {};
            if (!structure[cat][sit]) structure[cat][sit] = [];

            structure[cat][sit].push({
              id: row['_ID'],
              text: row['Pregunta']
            });
          });
          return structure;
        };

        // ==========================================
        // COMPONENTS
        // ==========================================

        const AudioPlayer = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [volume, setVolume] = useState(0.3);
            const [isExpanded, setIsExpanded] = useState(false);
            const audioRef = useRef(null);

            const currentTrack = PLAYLIST[currentTrackIndex];

            useEffect(() => {
                if(audioRef.current) {
                    audioRef.current.volume = volume;
                    if(isPlaying) {
                       audioRef.current.play().catch(e => console.log("Autoplay prevented by browser", e));
                    }
                }
            }, [currentTrackIndex, volume, isPlaying]);

            const togglePlay = () => {
                const audio = audioRef.current;
                if(!audio) return;
                if (isPlaying) {
                    audio.pause();
                } else {
                    audio.play();
                }
                setIsPlaying(!isPlaying);
            };

            const nextTrack = () => {
                setCurrentTrackIndex((prev) => (prev + 1) % PLAYLIST.length);
            };

            const prevTrack = () => {
                setCurrentTrackIndex((prev) => (prev - 1 + PLAYLIST.length) % PLAYLIST.length);
            };

            return (
                <div 
                    className={`fixed bottom-4 right-4 z-50 transition-all duration-300 border border-[#00ff41] bg-black/90 backdrop-blur-sm ${isExpanded ? 'w-64 p-4' : 'w-10 h-10 overflow-hidden p-0'} flex flex-col`}
                    onMouseEnter={() => setIsExpanded(true)}
                    onMouseLeave={() => setIsExpanded(false)}
                >
                    {/* Collapsed State Icon */}
                    {!isExpanded && (
                        <div className="w-full h-full flex items-center justify-center text-[#00ff41] animate-pulse cursor-pointer">
                            ♫
                        </div>
                    )}

                    {/* Expanded Content */}
                    <div className={`transition-opacity duration-300 ${isExpanded ? 'opacity-100' : 'opacity-0'}`}>
                        <div className="flex justify-between items-end mb-2 border-b border-[#00ff41]/30 pb-2">
                             <div className="text-[10px] text-[#00f3ff] font-bold tracking-widest">AUDIO_SYS</div>
                             {/* Visualizer */}
                             <div className={`flex items-end h-4 space-x-[1px] ${isPlaying ? '' : 'eq-paused'}`}>
                                 <div className="eq-bar h-2"></div>
                                 <div className="eq-bar h-4"></div>
                                 <div className="eq-bar h-3"></div>
                                 <div className="eq-bar h-1"></div>
                             </div>
                        </div>

                        <div className="text-[#00ff41] text-xs font-mono truncate mb-3">
                            <span className="text-[#00ff41]/50">{currentTrackIndex + 1}.</span> {currentTrack.title}
                        </div>

                        <div className="flex justify-between items-center mb-3">
                            <button onClick={prevTrack} className="text-[#00ff41] hover:text-[#00f3ff] text-xs">[PREV]</button>
                            <button onClick={togglePlay} className="text-[#00f3ff] hover:text-white font-bold text-xs border border-[#00f3ff] px-2 py-1 min-w-[50px]">
                                {isPlaying ? 'PAUSE' : 'PLAY'}
                            </button>
                            <button onClick={nextTrack} className="text-[#00ff41] hover:text-[#00f3ff] text-xs">[NEXT]</button>
                        </div>

                        <input 
                            type="range" 
                            min="0" 
                            max="1" 
                            step="0.05" 
                            value={volume} 
                            onChange={(e) => setVolume(parseFloat(e.target.value))}
                            className="w-full h-1 bg-[#00ff41]/20 appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-2 [&::-webkit-slider-thumb]:h-2 [&::-webkit-slider-thumb]:bg-[#00ff41]"
                        />
                    </div>
                    
                    <audio 
                        ref={audioRef}
                        src={currentTrack.src}
                        onEnded={nextTrack}
                    />
                </div>
            );
        };

        const LockoutScreen = ({ endTime, onUnlock }) => {
          const [timeLeft, setTimeLeft] = useState(0);
          useEffect(() => {
            const interval = setInterval(() => {
              const diff = Math.ceil((endTime - Date.now()) / 1000);
              if (diff <= 0) { clearInterval(interval); onUnlock(); } 
              else setTimeLeft(diff);
            }, 100);
            return () => clearInterval(interval);
          }, [endTime, onUnlock]);

          return (
            <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center border-4 border-red-900">
              <h1 className="text-8xl md:text-9xl font-bold text-red-600 tracking-tighter glow-text-red mb-8">BLOQUEADO</h1>
              <div className="text-9xl font-mono text-white bg-red-600 px-8 py-4 rounded glow-border-red animate-pulse">{timeLeft.toString().padStart(2, '0')}</div>
              <div className="mt-12 text-red-500 text-center max-w-md"><p>PROTOCOLO DE SEGURIDAD ACTIVO</p></div>
            </div>
          );
        };

        const SectorModal = ({ isOpen, questions, onClose, onSubmit }) => {
          const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
          const [shuffledOptions, setShuffledOptions] = useState([]);
          const currentQuestion = questions ? questions[currentQuestionIndex] : null;

          useEffect(() => { if (isOpen) setCurrentQuestionIndex(0); }, [isOpen]);
          useEffect(() => {
            if (isOpen && currentQuestion) {
              const options = [...currentQuestion.options];
              for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
              }
              setShuffledOptions(options);
            }
          }, [isOpen, currentQuestion]);

          if (!isOpen || !currentQuestion) return null;

          const handleOptionClick = (option) => {
            const isCorrect = option === currentQuestion.correctAnswer;
            if (isCorrect) {
              if (questions && currentQuestionIndex < questions.length - 1) setCurrentQuestionIndex(prev => prev + 1);
              else onSubmit(true);
            } else onSubmit(false);
          };

          return (
            <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl border-2 border-[#00f3ff] bg-black p-6 shadow-[0_0_30px_rgba(0,243,255,0.3)]">
                <div className="flex justify-between items-start mb-2 border-b border-[#00f3ff]/30 pb-4">
                  <div>
                    <h2 className="text-xl md:text-2xl text-[#00f3ff] glow-text-blue font-bold tracking-widest">DESENCRIPTACIÓN</h2>
                    <div className="text-xs text-[#00f3ff]/60 mt-1">FASE {currentQuestionIndex + 1} DE {questions?.length || 4}</div>
                  </div>
                  <button onClick={onClose} className="text-[#00f3ff] hover:text-white px-2 py-1">[CANCELAR]</button>
                </div>
                <div className="mb-8 mt-4"><p className="text-lg md:text-xl text-[#00ff41] leading-relaxed glow-text">{currentQuestion.text}</p></div>
                <div className="grid grid-cols-1 gap-4">
                  {shuffledOptions.map((option, idx) => (
                    <button key={idx} onClick={() => handleOptionClick(option)} className="group relative flex items-center p-4 border border-[#00ff41]/50 hover:border-[#00ff41] hover:bg-[#00ff41]/10 transition-all text-left">
                      <span className="w-6 h-6 flex items-center justify-center border border-[#00ff41] text-xs mr-4 text-[#00ff41] group-hover:bg-[#00ff41] group-hover:text-black">{String.fromCharCode(65 + idx)}</span>
                      <span className="text-gray-300 group-hover:text-white text-lg">{option}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        const BackgroundEffect = () => (
          <div className="fixed inset-0 z-0 bg-[#050505] pointer-events-none">
             <div className="absolute inset-0 bg-grid-pattern opacity-20"></div>
             <div className="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-[#050505]/80"></div>
          </div>
        );

        const GameInterface = ({ gameState, onSectorSolved, onMistake, onVictory }) => {
          const [selectedSector, setSelectedSector] = useState(null);
          const [vaultCode, setVaultCode] = useState(['', '', '', '', '']);

          const handleSectorClick = (sector) => { if (!sector.isSolved) setSelectedSector(sector); };
          const handleModalSubmit = (isCorrect) => {
            if (isCorrect && selectedSector) { onSectorSolved(selectedSector.id); setSelectedSector(null); }
            else { setSelectedSector(null); onMistake(); }
          };

          const handleVaultSubmit = () => {
            if (!gameState.sectors.every(s => s.isSolved)) { alert("DESBLOQUEA TODOS LOS ARCHIVOS PRIMERO"); return; }
            let correct = true;
            gameState.sectors.forEach((sector, idx) => { if (parseInt(vaultCode[idx]) !== sector.codeFragment) correct = false; });
            if (correct) onVictory(); else onMistake();
          };

          const topicParts = gameState.topic.split(' - ');
          const situationName = topicParts.length > 1 ? topicParts.slice(1).join(' - ') : (topicParts[0] || "SITUACIÓN");

          return (
            <div className="min-h-screen p-4 md:p-8 flex flex-col md:flex-row gap-8 relative z-10 overflow-hidden">
              <div className="w-full md:w-1/2 flex flex-col gap-4">
                <div className="border border-[#00ff41] bg-black/80 p-4 mb-4 glow-border flex justify-between items-center">
                    <div>
                        <h2 className="text-xl text-[#00ff41] font-bold">USUARIO: {gameState.player?.username}</h2>
                        <div className="text-xs text-[#00ff41]/70">AVATAR: {gameState.player?.avatar}</div>
                    </div>
                    <div className="text-right">
                       <div className="text-xs text-[#00f3ff]">OBJETIVO</div>
                       <div className="font-bold text-white">CAMBIAR NOTA</div>
                    </div>
                </div>

            try {
              if (!isBoot) setSyncStatus('DOWNLOADING');
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 8000); // 8s timeout for slower script

              const response = await fetch(trimmedUrl, { method: 'GET', signal: controller.signal });
              clearTimeout(timeoutId);

              if (!response.ok) throw new Error("Server error " + response.status);
              
              const result = await response.json();
              if (!isBoot) setSyncStatus('SUCCESS');

              if (result.config) {
                 const myConfig = result.config[APP_ID] || { disabledCategories: [], disabledSituations: [], disabledQuestions: [] };

// CONFIGURACIÓN
const ADMIN_PASSWORD = "malaga"; // <--- CAMBIA ESTO POR TU CONTRASEÑA

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  
  // 1. Lectura de Datos (Data)
  var sheetData = ss.getSheetByName("Data");
  if (!sheetData) {
    sheetData = ss.insertSheet("Data");
    sheetData.appendRow(["FECHA", "ALUMNO", "AVATAR", "ASIGNATURA", "SITUACION", "NOTA", "TIEMPO"]);
  }
  var dataValues = sheetData.getDataRange().getValues();
  var rows = dataValues.slice(1);
  var result = rows.map(function(row) {
    return {
      date: row[0], 
      username: row[1], 
      avatar: row[2], 
      category: row[3], 
      situation: row[4], 
      grade: row[5], 
      time: row[6]
    };
  });
  
  // 2. Lectura de Configuración (Config)
  var sheetConfig = ss.getSheetByName("Config");
  var allConfigs = {};
  if (sheetConfig) {
     var cell = sheetConfig.getRange("A1").getValue();
     if (cell) {
       try { allConfigs = JSON.parse(cell); } catch(e) {}
     }
  }
  
  return ContentService.createTextOutput(JSON.stringify({
    data: result,
    config: allConfigs
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  lock.tryLock(10000);
  
  try {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var payload = JSON.parse(e.postData.contents);
    
    // --- AUTENTICACIÓN ADMIN ---
    if (payload.action === 'admin_login') {
       var result = (payload.password === ADMIN_PASSWORD) ? "success" : "error";
       return ContentService.createTextOutput(JSON.stringify({ result: result }))
              .setMimeType(ContentService.MimeType.JSON);
    }
    
    if (payload.action === 'save_config') {
       // --- GUARDAR CONFIGURACIÓN ---
       var sheetConfig = ss.getSheetByName("Config");
       if (!sheetConfig) sheetConfig = ss.insertSheet("Config");
       
       var currentData = {};
       var cellVal = sheetConfig.getRange("A1").getValue();
       if (cellVal) {
          try { currentData = JSON.parse(cellVal); } catch(e) {}
       }
       
       var appId = payload.appId || 'default';
       currentData[appId] = payload.config;
       
       sheetConfig.getRange("A1").setValue(JSON.stringify(currentData));
       return ContentService.createTextOutput("Config Saved");
       
    } else {
       // --- GUARDAR REGISTRO DE ALUMNO ---
       var sheetData = ss.getSheetByName("Data");
       if (!sheetData) sheetData = ss.insertSheet("Data");
       
       sheetData.appendRow([ 
         payload.date || new Date(), 
         payload.username, 
         payload.avatar, 
         payload.category, 
         payload.situation, 
         payload.grade, 
         payload.time 
       ]);
       
       return ContentService.createTextOutput("Record Saved");
    }
  } catch(err) {
    return ContentService.createTextOutput("Error: " + err.toString());
  } finally {
    lock.releaseLock();
  }
}

                        Vuelve a este archivo <code>index.html</code> y busca la constante <code>API_URL</code> (al principio del script).
                    </p>
                    <div className="bg-black border border-green-500/30 p-4 font-mono text-sm">
                        <span className="text-purple-400">const</span> <span className="text-blue-400">API_URL</span> = <span className="text-green-400">"PEGA_AQUÍ_TU_URL_DE_APPS_SCRIPT"</span>;
                    </div>
                    <p className="mt-4 text-xs text-gray-500">
                        NOTA: Si alguna vez cambias el código en Google Apps Script, debes hacer una <strong className="text-white">Nueva implementación</strong> (versión nueva) para que los cambios surtan efecto. Guardar el archivo no es suficiente.
                    </p>
                  </div>

                </div>
              </div>
            </div>
          );

          const renderAdminConfig = () => {
             const fullStructure = getFullDataStructure();
             const categories = Object.keys(fullStructure).sort();

             return (
               <div className="flex flex-col h-full overflow-hidden">
                 <div className="flex justify-between items-center p-4 bg-[#00ff41]/10 border-b border-[#00ff41]">
                    <div>
                        <h3 className="text-lg font-bold text-[#00ff41]">CONFIGURACIÓN DE JUEGO</h3>
                        <div className="text-xs text-[#00f3ff]">EDITANDO ID: <span className="font-bold text-white bg-[#00f3ff]/20 px-2">{APP_ID}</span></div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={() => setShowSetupInstructions(true)} className="px-4 py-2 border border-yellow-500 text-yellow-500 text-xs font-bold hover:bg-yellow-500 hover:text-black transition-all">
                            INSTRUCCIONES
                        </button>
                        <button onClick={handleSaveConfig} className="px-6 py-2 bg-[#00ff41] text-black font-bold hover:bg-white transition-all">
                        {syncStatus === 'UPLOADING' ? 'GUARDANDO...' : 'GUARDAR CAMBIOS'}
                        </button>
                    </div>
                 </div>
                 
                 <div className="flex-grow overflow-y-auto p-4 custom-scrollbar bg-black/80">
                    {categories.map(cat => {
                       const isCatDisabled = tempConfig.disabledCategories.includes(cat);
                       const situations = Object.keys(fullStructure[cat]).sort();
                       return (
                         <div key={cat} className={`mb-4 border ${isCatDisabled ? 'border-red-900 bg-red-900/5' : 'border-[#00ff41]/30 bg-[#00ff41]/5'} p-4`}>
                            <div className="flex items-center justify-between mb-4">
                               <div className="flex items-center gap-3">
                                  <label className="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" className="sr-only peer toggle-checkbox" checked={!isCatDisabled} onChange={() => toggleCategory(cat)} />
                                    <div className="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#00ff41]"></div>
                                  </label>
                                  <h4 className={`text-xl font-bold ${isCatDisabled ? 'text-gray-500' : 'text-[#00ff41]'}`}>{cat}</h4>
                               </div>
                            </div>
                            {!isCatDisabled && (
                              <div className="ml-8 grid grid-cols-1 gap-2 border-l-2 border-[#00ff41]/20 pl-4">
                                 {situations.map(sit => {
                                    const isSitDisabled = tempConfig.disabledSituations.includes(sit);
                                    const questions = fullStructure[cat][sit];
                                    const expandKey = cat+sit;
                                    const isExpanded = expandedSituations[expandKey];
                                    return (
                                       <div key={sit} className={`py-2`}>
                                          <div className="flex items-center justify-between">
                                             <div className="flex items-center gap-3">
                                                <label className="relative inline-flex items-center cursor-pointer">
                                                  <input type="checkbox" className="sr-only peer toggle-checkbox" checked={!isSitDisabled} onChange={() => toggleSituation(sit)} />
                                                  <div className="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#00f3ff]"></div>
                                                </label>
                                                <span className={`${isSitDisabled ? 'text-gray-500' : 'text-[#00f3ff]'} font-bold`}>{sit}</span>
                                             </div>
                                             {!isSitDisabled && (
                                               <button onClick={() => toggleExpandSituation(expandKey)} className="text-xs text-[#00f3ff]/70 hover:text-white underline">
                                                  {isExpanded ? 'OCULTAR PREGUNTAS' : `VER PREGUNTAS (${questions.length})`}
                                               </button>
                                             )}
                                          </div>
                                          {isExpanded && !isSitDisabled && (
                                             <div className="mt-2 ml-12 space-y-1">
                                                {questions.map(q => {
                                                   const isQDisabled = tempConfig.disabledQuestions.includes(q.id);
                                                   return (
                                                      <div key={q.id} className={`flex items-start gap-2 text-xs p-2 rounded cursor-pointer ${isQDisabled ? 'text-gray-600' : 'text-gray-300 hover:bg-white/10'}`} onClick={() => toggleQuestion(q.id)}>
                                                         <div className={`w-3 h-3 mt-0.5 border flex-shrink-0 ${isQDisabled ? 'border-red-500' : 'bg-[#00ff41] border-[#00ff41]'}`}></div>
                                                         <span>{q.text}</span>
                                                      </div>
                                                   );
                                                })}
                                             </div>
                                          )}
                                       </div>
                                    );
                                 })}
                              </div>
                            )}
                         </div>
                       );
                    })}
                 </div>
               </div>
             );
          };

          const renderAdminDashboard = () => {
            const filteredData = adminData.filter(row => {
              const matchCat = adminFilterCategory ? row.category === adminFilterCategory : true;
              const matchSit = adminFilterSituation ? row.situation === adminFilterSituation : true;
              return matchCat && matchSit;
            });
            const uniqueCats = Array.from(new Set(adminData.map(r => r.category))).filter(Boolean).sort();
            
            // Dynamic Situations based on Category Selection
            const uniqueSits = Array.from(new Set(adminData
                .filter(r => !adminFilterCategory || r.category === adminFilterCategory)
                .map(r => r.situation)
            )).filter(Boolean).sort();

            return (
              <div className="min-h-screen p-4 md:p-8 flex flex-col relative z-20">
                 <div className="w-full max-w-7xl mx-auto border border-[#00ff41] bg-black/95 flex flex-col h-[90vh]">
                    <div className="p-6 border-b border-[#00ff41] flex flex-col md:flex-row justify-between items-center gap-4">
                       <div>
                          <h1 className="text-3xl font-bold text-[#00ff41] glow-text">PANEL DE CONTROL</h1>
                          <div className="flex gap-4 text-xs font-mono mt-1">
                              <span className="text-[#00ff41]/50">USER: {ADMIN_CONFIG.USERNAME}</span>
                              <span className="text-[#00f3ff]">APP ID ACTUAL: <strong className="text-white border border-[#00f3ff] px-1">{APP_ID}</strong></span>
                          </div>
                       </div>
                       <div className="flex gap-3">
                           <button onClick={async () => { const data = await fetchReports(); setAdminData(data); }} className="px-4 py-2 border border-[#00f3ff] text-[#00f3ff] text-xs hover:bg-[#00f3ff] hover:text-black font-bold transition-all">
                                REFRESCAR DATOS
                           </button>
                           <button onClick={handleLogout} className="px-4 py-2 border border-red-500 text-red-500 text-xs hover:bg-red-500 hover:text-black font-bold transition-all">
                                CERRAR SESIÓN
                           </button>
                       </div>
                    </div>

                    <div className="flex border-b border-[#00ff41]">
                        <button onClick={() => setAdminTab('REPORTS')} className={`flex-1 py-3 font-bold ${adminTab === 'REPORTS' ? 'bg-[#00ff41] text-black' : 'text-[#00ff41] hover:bg-[#00ff41]/20'}`}>REPORTES</button>
                        <button onClick={() => { setAdminTab('CONFIG'); setTempConfig(serverConfig); }} className={`flex-1 py-3 font-bold ${adminTab === 'CONFIG' ? 'bg-[#00ff41] text-black' : 'text-[#00ff41] hover:bg-[#00ff41]/20'}`}>CONFIGURACIÓN</button>
                    </div>

                    <div className="flex-grow overflow-hidden bg-black relative">
                       {adminTab === 'CONFIG' ? renderAdminConfig() : (
                         <div className="flex flex-col h-full">
                            <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-[#00ff41]/30 bg-[#00ff41]/5 items-center">
                               <select value={adminFilterCategory} onChange={(e) => { setAdminFilterCategory(e.target.value); setAdminFilterSituation(''); }} className="bg-black border border-[#00ff41] text-[#00ff41] p-2 focus:outline-none text-xs">
                                    <option value="">-- TODAS LAS ASIGNATURAS --</option>
                                    {uniqueCats.map((c, i) => <option key={i} value={c}>{c}</option>)}
                               </select>
                               
                               <select value={adminFilterSituation} onChange={(e) => setAdminFilterSituation(e.target.value)} className="bg-black border border-[#00ff41] text-[#00ff41] p-2 focus:outline-none text-xs">
                                    <option value="">-- TODAS LAS SITUACIONES --</option>
                                    {uniqueSits.map((c, i) => <option key={i} value={c}>{c}</option>)}
                               </select>

                               <div className="text-right text-xs text-[#00ff41]/50 font-mono">
                                    MOSTRANDO: {filteredData.length} REGISTROS
                                </div>
                            </div>
                            <div className="flex-grow overflow-auto p-4 custom-scrollbar">
                               {filteredData.length === 0 ? <div className="text-center text-gray-500 py-12">SIN REGISTROS QUE COINCIDAN</div> : (
                                 <table className="w-full text-left border-collapse">
                                    <thead className="text-xs text-[#00ff41] border-b border-[#00ff41] sticky top-0 bg-black"><tr><th className="p-3">FECHA</th><th className="p-3">ALUMNO</th><th className="p-3">ASIGNATURA</th><th className="p-3">SITUACIÓN</th><th className="p-3">NOTA</th></tr></thead>
                                    <tbody className="text-sm font-mono text-gray-300">
                                      {filteredData.map((row, idx) => (
                                        <tr key={idx} className="border-b border-[#00ff41]/20 hover:bg-[#00ff41]/10"><td className="p-3">{formatDate(row.date)}</td><td className="p-3 font-bold text-white">{row.username}</td><td className="p-3 text-[#00ff41]">{row.category}</td><td className="p-3 text-[#00f3ff]">{row.situation}</td><td className="p-3 text-white font-bold">{row.grade}</td></tr>
                                      ))}
                                    </tbody>
                                 </table>
                               )}
                            </div>
                         </div>
                       )}
                    </div>
                 </div>
              </div>
            );
          };

          // --- BOOT & AUTH ---
          if (appStatus === 'BOOTING') return (
             <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-8 font-mono">
                <div className="w-full max-w-2xl text-[#00ff41] text-xs">BIOS v2.2.0 [MULTI-TENANT] -- {bootMessage}<div className="h-2 w-full bg-[#00ff41]/20 rounded mt-2 overflow-hidden"><div className="h-full bg-[#00ff41] animate-[width_2s_ease-in-out_infinite]" style={{width: '60%'}}></div></div></div>
             </div>
          );
          if (appStatus === 'ERROR') return (
             <div className="fixed inset-0 z-50 bg-red-950/20 flex flex-col items-center justify-center p-8 font-mono text-center">
                <h1 className="text-5xl font-bold text-red-600 mb-4">SYSTEM HALTED</h1>
                <p className="text-red-500 mb-8">{bootError}</p>
                <button onClick={() => window.location.reload()} className="px-8 py-3 bg-red-600 text-black font-bold hover:bg-white">REINICIAR</button>
             </div>
          );

          // ... LOGIN & STEPS ...
          const renderLogin = () => (
            <div className="w-full max-w-4xl border border-[#00ff41] bg-black/90 p-8 shadow relative animate-fade-in text-center">
              <div className="absolute top-2 left-2 text-[10px] text-gray-600 font-mono">SESIÓN ID: {APP_ID}</div>
              <h1 className="text-4xl md:text-6xl font-bold mb-2 glow-text tracking-tighter text-[#00ff41]">HACKEAR EL <span className="text-[#00f3ff]">SISTEMA</span></h1>
              <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && username && handleLoginSubmit()} className="w-full max-w-md bg-black border border-[#00ff41] p-3 text-white text-center text-xl mb-4 focus:outline-none focus:shadow-[0_0_10px_#00ff41]" placeholder="INTRODUCE TU NOMBRE" />
              <button disabled={!username} onClick={handleLoginSubmit} className="w-full max-w-md py-3 bg-[#00ff41]/20 border border-[#00ff41] text-[#00ff41] hover:bg-[#00ff41] hover:text-black font-bold transition-all disabled:opacity-30">INICIAR SESIÓN >></button>
            </div>
          );

          const renderAvatarSelection = () => (
            <div className="w-full max-w-5xl border border-[#00f3ff] bg-black/90 p-8 relative">
               <h2 className="text-3xl text-center text-[#00f3ff] mb-6 glow-text-blue">SELECCIONA TU AVATAR</h2>
               <div className="grid grid-cols-3 md:grid-cols-6 gap-4 mb-8">
                  {AVATAR_LIST.map((av, idx) => (
                    <button key={idx} onClick={() => { setSelectedAvatar(av.emoji); if(allCategories.length===1){setSelectedCategory(allCategories[0]); setCurrentStep('SITUATION');}else{setCurrentStep('CATEGORY');} }} className="flex flex-col items-center gap-2 border border-[#00f3ff]/30 hover:border-[#00f3ff] hover:bg-[#00f3ff]/10 p-4 transition-all group">
                      <div className="text-4xl md:text-5xl">{av.emoji}</div>
                      <span className="text-xs text-[#00f3ff] group-hover:text-white">{av.name}</span>
                    </button>
                  ))}
               </div>
               <button onClick={() => setCurrentStep('LOGIN')} className="text-[#00ff41] underline text-xs">{'<<'} VOLVER</button>
            </div>
          );

          const renderCategorySelection = () => (
            <div className="w-full max-w-2xl border border-[#00ff41] bg-black/90 p-8 relative">
              <h2 className="text-2xl text-center text-[#00ff41] mb-6 glow-text">SELECCIONA ASIGNATURA</h2>
              <div className="flex flex-col gap-3 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                {allCategories.length > 0 ? allCategories.map((cat) => (
                  <button key={cat} onClick={() => { setSelectedCategory(cat); setCurrentStep('SITUATION'); }} className="border border-[#00ff41] p-4 text-left hover:bg-[#00ff41] hover:text-black transition-all font-bold tracking-wider">{cat}</button>
                )) : <div className="text-center text-[#00ff41]/50 italic p-4">NO HAY ASIGNATURAS ACTIVAS EN ESTA SESIÓN ({APP_ID})</div>}
              </div>
              <button onClick={() => setCurrentStep('AVATAR')} className="mt-4 text-[#00f3ff] underline text-xs">{'<<'} VOLVER</button>
            </div>
          );

          const renderSituationSelection = () => (
            <div className="w-full max-w-2xl border border-[#00f3ff] bg-black/90 p-8 relative">
              <h2 className="text-2xl text-center text-[#00f3ff] mb-2 glow-text-blue">SITUACIÓN DE APRENDIZAJE</h2>
              <div className="mb-6 text-center text-xs text-[#00ff41] border-b border-[#00ff41]/30 pb-2">ASIGNATURA: <strong>{selectedCategory}</strong></div>
              <div className="flex flex-col gap-3 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                {allSituations.length > 0 ? allSituations.map((sit) => (
                  <button key={sit} onClick={() => { setSelectedSituation(sit); handleStartGame(sit); }} className="border border-[#00f3ff] p-4 text-left hover:bg-[#00f3ff] hover:text-black transition-all flex justify-between"><span>{sit}</span> <span className="font-mono">[HACKEAR]</span></button>
                )) : <div className="text-center text-[#00f3ff]/50 italic p-4">NO HAY SITUACIONES DISPONIBLES</div>}
              </div>
              <button onClick={() => {if(allCategories.length===1){setCurrentStep('AVATAR');}else{setCurrentStep('CATEGORY');}}} className="mt-4 text-[#00ff41] underline text-xs">{'<<'} VOLVER</button>
            </div>
          );

          const handleLoginSubmit = () => { if (username.trim() === ADMIN_CONFIG.USERNAME) { setShowAdminAuth(true); return; } setCurrentStep('AVATAR'); };

          return (
            <>
              <BackgroundEffect />
              
              {/* Persistent Audio Player */}
              <AudioPlayer />
              
              {gameState.status === 'LOCKED' && gameState.lockoutEndTime && <LockoutScreen endTime={gameState.lockoutEndTime} onUnlock={handleUnlock} />}
              {showAdminAuth && (
                 <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
                   <div className="w-full max-w-md border border-red-500 bg-black p-8 text-center relative">
                      <button onClick={() => {setShowAdminAuth(false); setUsername('');}} className="absolute top-2 right-2 text-red-500">[X]</button>
                      <h2 className="text-2xl text-red-500 font-bold mb-6">AUTENTICACIÓN ROOT</h2>
                      <input type="password" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdminAuthSubmit()} className="w-full bg-black border border-red-500 p-3 text-red-500 text-center mb-4 focus:outline-none" placeholder="PASSWORD" />
                      {adminError && <div className="text-red-500 mb-4">{adminError}</div>}
                      <button onClick={handleAdminAuthSubmit} disabled={authLoading} className="w-full py-3 bg-red-900/20 border border-red-500 text-red-500 hover:bg-red-500 hover:text-black font-bold disabled:opacity-50">
                        {authLoading ? "VERIFICANDO..." : "ACCEDER"}
                      </button>
                   </div>
                 </div>
              )}
              {showSetupInstructions && renderSetupInstructions()}
              {currentStep !== 'GAME' && currentStep !== 'VICTORY' && currentStep !== 'ADMIN_DASHBOARD' && (
                <div className="min-h-screen flex items-center justify-center p-4 relative z-10">
                   {currentStep === 'LOGIN' && renderLogin()}
                   {currentStep === 'AVATAR' && renderAvatarSelection()}
                   {currentStep === 'CATEGORY' && renderCategorySelection()}
                   {currentStep === 'SITUATION' && renderSituationSelection()}
                </div>
              )}
              {currentStep === 'ADMIN_DASHBOARD' && renderAdminDashboard()}
              {currentStep === 'GAME' && <GameInterface gameState={gameState} onSectorSolved={handleSectorSolved} onMistake={handleMistake} onVictory={handleVictory} />}
              {gameState.status === 'LOCKED' && currentStep === 'GAME' && <div className="filter blur-sm pointer-events-none fixed inset-0 z-0"><GameInterface gameState={gameState} onSectorSolved={()=>{}} onMistake={()=>{}} onVictory={()=>{}} /></div>}
              {currentStep === 'VICTORY' && (
                  <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center z-10 relative">
                    {/* Victory Sound Effect Element */}
                    <audio ref={victoryAudioRef} src={VICTORY_SOUNDS[0]} />
                    
                    <h1 className="text-5xl md:text-7xl text-[#00ff41] font-bold glow-text mb-8">¡SISTEMA VULNERADO!</h1>
                    <div className="w-full max-w-2xl bg-black border-2 border-[#00ff41] p-8 mb-8 relative shadow-[0_0_30px_rgba(0,255,65,0.1)]">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 text-left mt-4">
                         <div className="border-b border-[#00ff41]/30 pb-2"><span className="text-[#00ff41]/60 text-xs block mb-1">ALUMNO</span><span className="text-white text-xl uppercase">{username}</span></div>
                         <div className="border-b border-[#00ff41]/30 pb-2"><span className="text-[#00ff41]/60 text-xs block mb-1">ASIGNATURA</span><span className="text-white text-xl uppercase">{selectedCategory}</span></div>
                         <div className="border-b border-[#00ff41]/30 pb-2"><span className="text-[#00ff41]/60 text-xs block mb-1">SITUACIÓN</span><span className="text-white text-xl uppercase">{selectedSituation}</span></div>
                         <div className="border-b border-[#00ff41]/30 pb-2"><span className="text-[#00ff41]/60 text-xs block mb-1">TIEMPO</span><span className="text-white text-xl font-mono">{gameState.endTime && gameState.startTime ? formatTime(gameState.endTime - gameState.startTime) : "00:00:00"}</span></div>
                      </div>
                      {!dbUpdateSuccess ? (
                        <div className="flex flex-col items-center gap-4 bg-[#00ff41]/5 p-6 border border-[#00ff41]/30">
                           <label className="text-[#00ff41] font-bold text-lg">NUEVA NOTA</label>
                           <div className="flex gap-4 items-center w-full justify-center">
                             <input type="number" min="0" max="10" value={inputGrade} onChange={(e) => setInputGrade(e.target.value)} className="w-24 bg-black border-2 border-[#00ff41] text-3xl text-center text-white py-2 focus:outline-none" />
                             <button onClick={handleDbUpdate} disabled={isDbUpdating || !inputGrade} className="px-6 py-3 bg-[#00ff41] text-black font-bold uppercase hover:bg-white transition-all disabled:opacity-50">{isDbUpdating ? "..." : "MODIFICAR"}</button>
                           </div>
                        </div>
                      ) : (
                        <div className="bg-[#00ff41]/20 border border-[#00ff41] p-6 animate-pulse">
                           <div className="text-2xl font-bold text-white mb-2">GUARDADO</div>
                           <div className="text-4xl font-bold text-[#00ff41]">{inputGrade}</div>
                        </div>
                      )}
                    </div>
                    {dbUpdateSuccess && (
                        <div className="flex flex-col gap-4 mt-6">
                            <div className="text-[#00ff41] text-sm animate-pulse">REGISTRO COMPLETADO CORRECTAMENTE</div>
                            <button onClick={handleLogout} className="px-8 py-3 border-2 border-[#00f3ff] text-[#00f3ff] font-bold text-xl hover:bg-[#00f3ff] hover:text-black transition-all uppercase tracking-widest glow-border">
                                VOLVER A JUGAR
                            </button>
                        </div>
                    )}
                  </div>
              )}
            </>
          );
        };

        const root = createRoot(document.getElementById('root'));
        try {
            root.render(<App />);
        } catch (e) {
            document.body.innerHTML = '<div style="color:red;padding:20px;">CRITICAL RENDER ERROR: ' + e.message + '</div>';
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
